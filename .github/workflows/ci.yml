name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  validate:
    name: Lint & MVP smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install Linux build dependencies
        run: bash scripts/ci-install-linux-build-deps.sh

      - name: Install chmcmd
        run: bash scripts/ci-install-chmcmd.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild native addon
        run: pnpm run native:rebuild

      - name: Lint
        run: pnpm run lint

      - name: MVP acceptance (test:mvp)
        run: pnpm run test:mvp
        env:
          USE_SYSTEM_FUSE: 'true'
